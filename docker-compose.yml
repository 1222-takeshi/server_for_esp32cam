services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
      - data:/app/data
      - ./models:/app/models:ro
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uploads:
  data:
