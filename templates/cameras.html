<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cameras</title>
</head>
<body>
    <h1>Cameras</h1>
    {% if camera_summaries %}
    <ul>
        {% for summary in camera_summaries %}
        <li>
            <a href="{{ url_for('server.camera_detail', camera_id=summary.camera.camera_id) }}">{{ summary.camera.display_name }}</a>
            <div>Status: {{ summary.status }}</div>
            <div>Last Seen: {{ summary.camera.last_seen_at.isoformat() }}</div>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No cameras registered yet.</p>
    {% endif %}
    <a href="{{ url_for('server.index') }}">Back to Home</a>
</body>
</html>
