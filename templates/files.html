<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uploaded Files</title>
</head>
<body>
    <h1>Uploaded Files</h1>
    {% if files %}
    <ul>
        {% for file in files %}
        <li>
            <a href="{{ url_for('server.get_file', filename=file.name) }}">{{ file.name }}</a>
            ({{ file.size }} bytes, {{ file.created_at.isoformat() }})
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No uploaded files found.</p>
    {% endif %}
    <a href="{{ url_for('server.index') }}">Back to Home</a>
</body>
</html>
