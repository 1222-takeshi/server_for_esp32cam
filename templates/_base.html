<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ESP32-CAM{% endblock %} — CamServer</title>
  <!-- Intentionally no external font CDN (see #341 / #316): this page must
       render fully from same-origin assets so LAN/Tailscale-only
       deployments with no general internet egress aren't penalized by a
       render-relevant external network round-trip. static/base.css's
       --sans/--mono variables already fall back to system-ui/ui-monospace
       when 'Inter'/'JetBrains Mono' aren't installed locally. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
<nav class="nav">
  <a class="nav-logo" href="{{ url_for('server.index') }}">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <rect x="1" y="1" width="16" height="16" rx="4" stroke="#7170ff" stroke-width="1.5"/>
      <circle cx="9" cy="9" r="3.5" fill="#7170ff"/>
    </svg>
    CamServer
  </a>
  <div class="nav-links">
    <a class="nav-link {% if request.endpoint == 'server.index' %}active{% endif %}" href="{{ url_for('server.index') }}">Dashboard</a>
    <a class="nav-link {% if request.endpoint == 'server.list_cameras' %}active{% endif %}" href="{{ url_for('server.list_cameras') }}">Cameras</a>
    <a class="nav-link {% if request.endpoint == 'server.list_files' %}active{% endif %}" href="{{ url_for('server.list_files') }}">Files</a>
  </div>
  <div class="nav-ws-status" id="ws-status-global">
    <div class="ws-dot" id="ws-dot-global"></div>
    <span id="ws-label-global">—</span>
  </div>
</nav>
{% block body %}{% endblock %}

<!-- Shared helpers (formatTimestamp/formatFrameSize/reconnect timing
     constants) used by index.html's and camera_detail.html's own
     per-page scripts below -- see #358. -->
<script src="{{ url_for('static', filename='dashboard-shared.js') }}"></script>
<script>
// Shared WS status indicator
(function() {
  const dot   = document.getElementById('ws-dot-global');
  const label = document.getElementById('ws-label-global');
  window._setWsStatus = function(state) {
    dot.className   = 'ws-dot ' + state;
    label.textContent = state === 'connected' ? 'live' : state === 'reconnecting' ? 'reconnecting…' : 'offline';
  };
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
