[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "server-for-esp32cam"
version = "0.1.0"
description = "Snapshot-first server for ESP32-CAM image uploads."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.1.3,<4.0",
  "Flask-Limiter>=3.5,<5.0",
  "Flask-Sock>=0.7,<0.8",
  # Not just a production-server runtime choice: script/inference.py
  # dispatches detect() calls through gevent.threadpool.ThreadPool (see
  # #244/#259), so it's imported unconditionally by script/app.py now,
  # regardless of which extras are installed.
  "gevent>=24,<27",
  "Pillow>=12.2,<13.0",
  "python-json-logger>=2.0,<4.0",
  "prometheus-client>=0.20,<0.27",
  "Werkzeug>=3.1.9,<4.0",
]

[project.optional-dependencies]
dev = [
  "websockets>=17,<18",  # Exercise the isolated receiver transport in CI.
  "numpy>=1.26,<3.0",  # Real numerical ONNX postprocessing tests run in CI.
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.15,<0.17",
  "pip-audit>=2.7,<3.0",
  "pyyaml>=6.0,<7.0",
]
ml = [
  "numpy>=1.26,<3.0",
  "tflite-runtime>=2.14,<3.0; python_version < '3.12'",
  "ai-edge-litert>=1.0,<3.0; python_version >= '3.12'",
]
capture = [
  "websockets>=17,<18",
]
onnx = [
  "numpy>=1.26,<3.0",
  "onnxruntime>=1.23,<2.0",
]
server = [
  "gunicorn>=23,<27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Defaults (E4, E7, E9, F) plus perflint (PERF), bugbear (B), comprehension
# anti-patterns (C4) and simplify (SIM) -- these catch the class of Python-level
# performance/correctness anti-pattern this repo has historically found and
# fixed by hand across many individual review PRs. See #426.
select = ["E4", "E7", "E9", "F", "PERF", "B", "C4", "SIM"]

[tool.setuptools.packages.find]
include = ["script*"]
