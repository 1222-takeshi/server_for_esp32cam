[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "server-for-esp32cam"
version = "0.1.0"
description = "Snapshot-first server for ESP32-CAM image uploads."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.11,<0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
include = ["script*"]
