[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "server-for-esp32cam"
version = "0.1.0"
description = "Snapshot-first server for ESP32-CAM image uploads."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.1.3,<4.0",
  "Flask-Limiter>=3.5,<4.0",
  "Flask-Sock>=0.7,<0.8",
  "Pillow>=12.2,<13.0",
  "python-json-logger>=2.0,<4.0",
  "prometheus-client>=0.20,<0.22",
  "Werkzeug>=3.1.6,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.11,<0.12",
  "pip-audit>=2.7,<3.0",
  "pyyaml>=6.0,<7.0",
]
ml = [
  "numpy>=1.26,<3.0",
  "tflite-runtime>=2.14,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
include = ["script*"]
