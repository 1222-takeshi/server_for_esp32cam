name: Rust PoC
on:
  push:
    branches: [main]
    paths: ['rust/**', 'scripts/prepare_rust_jpeg.py', 'tests/test_prepare_rust_jpeg.py', '.github/workflows/rust.yml']
  pull_request:
    paths: ['rust/**', 'scripts/prepare_rust_jpeg.py', 'tests/test_prepare_rust_jpeg.py', '.github/workflows/rust.yml']
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBOJPEG_SOURCE: explicit
      TURBOJPEG_STATIC: '1'
      TURBOJPEG_LIB_DIR: ${{ runner.temp }}/rust-jpeg
    defaults:
      run:
        working-directory: rust/frame-worker
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/prepare_rust_jpeg.py --arch amd64 --output "$TURBOJPEG_LIB_DIR"
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}-${{ runner.arch }}
        id: audit-cache
      - if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
