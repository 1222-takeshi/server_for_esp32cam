name: CI Fallback Gate

permissions: {}

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: ci-fallback-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event.workflow_run.conclusion != 'cancelled' || github.event.workflow_run.event == 'push'
    runs-on: [self-hosted, Linux, ARM64, server-for-esp32cam-gate]
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      contents: read
    outputs:
      decision: ${{ steps.inspect.outputs.decision }}
      repository: ${{ steps.inspect.outputs.repository }}
      head_sha: ${{ steps.inspect.outputs.head_sha }}
      check_id: ${{ steps.inspect.outputs.check_id }}
    steps:
      - name: Check out trusted control code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false

      - name: Inspect GitHub-hosted jobs
        id: inspect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 control/scripts/ci/github_actions_gate.py inspect
          --event "$GITHUB_EVENT_PATH"
          --trusted-actor "${{ github.repository_owner }}"
          --expected "test (3.11)"
          --expected "test (3.12)"
          --expected "dependency-audit"
          --expected "compile-esp32-example"
          --github-output "$GITHUB_OUTPUT"

      - name: Record GitHub-hosted success
        if: steps.inspect.outputs.decision == 'hosted_success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 control/scripts/ci/github_actions_gate.py complete
          --repository "${{ steps.inspect.outputs.repository }}"
          --check-id "${{ steps.inspect.outputs.check_id }}"
          --conclusion success
          --title "GitHub-hosted CI passed"
          --summary "GitHub-hosted test matrix, dependency audit, and ESP32 example compile passed. Local fallback was not executed."

      - name: Record non-billing failure
        if: steps.inspect.outputs.decision == 'hard_failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 control/scripts/ci/github_actions_gate.py complete
          --repository "${{ steps.inspect.outputs.repository }}"
          --check-id "${{ steps.inspect.outputs.check_id }}"
          --conclusion failure
          --title "GitHub-hosted CI failed"
          --summary "The failure did not contain complete billing-limit evidence, so local fallback was not executed."

      - name: Fail closed for non-billing failure
        if: steps.inspect.outputs.decision == 'hard_failure'
        run: exit 1

  fallback:
    needs: inspect
    if: needs.inspect.outputs.decision == 'billing_fallback'
    runs-on: [self-hosted, Linux, ARM64, server-for-esp32cam-fallback]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    permissions:
      contents: read
    steps:
      - name: Check out trusted repository commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.inspect.outputs.head_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python tests
        run: scripts/ci/run-check.sh test

      - name: Run dependency audit once
        if: matrix.python-version == '3.11'
        run: scripts/ci/run-check.sh dependency-audit

      - name: Prepare config.h for CI
        if: matrix.python-version == '3.11'
        run: cp examples/esp32cam_snapshot_upload/config.h.example examples/esp32cam_snapshot_upload/config.h

      - name: Compile ESP32-CAM example
        if: matrix.python-version == '3.11'
        uses: arduino/compile-sketches@25426ace8a446e747a3d3d7a9da759a6925613aa
        with:
          fqbn: esp32:esp32:esp32cam
          platforms: |
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          libraries: "[]"
          sketch-paths: |
            - examples/esp32cam_snapshot_upload
          verbose: true

  finalize:
    needs: [inspect, fallback]
    if: always() && needs.inspect.outputs.decision == 'billing_fallback'
    runs-on: [self-hosted, Linux, ARM64, server-for-esp32cam-gate]
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out trusted control code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false

      - name: Record successful local fallback
        if: needs.fallback.result == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 control/scripts/ci/github_actions_gate.py complete
          --repository "${{ needs.inspect.outputs.repository }}"
          --check-id "${{ needs.inspect.outputs.check_id }}"
          --conclusion success
          --title "Local fallback CI passed"
          --summary "GitHub-hosted jobs could not start because of billing limits. The self-hosted runner completed the test matrix, dependency audit, and ESP32 example compile."

      - name: Record failed local fallback
        if: needs.fallback.result != 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 control/scripts/ci/github_actions_gate.py complete
          --repository "${{ needs.inspect.outputs.repository }}"
          --check-id "${{ needs.inspect.outputs.check_id }}"
          --conclusion failure
          --title "Local fallback CI failed"
          --summary "The self-hosted runner did not complete the fallback checks successfully."

      - name: Enforce local fallback result
        if: needs.fallback.result != 'success'
        run: exit 1
