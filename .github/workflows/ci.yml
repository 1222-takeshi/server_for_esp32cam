name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "test/**"
      - "perf/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest with coverage
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest \
            -p pytest_cov \
            --cov=script \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --durations=10
      - name: Upload coverage to GitHub Actions Summary
        if: always()
        run: |
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Dependency vulnerability audit
        run: pip-audit --desc on

  compile-esp32-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare config.h for CI
        run: cp examples/esp32cam_snapshot_upload/config.h.example examples/esp32cam_snapshot_upload/config.h
      - name: Compile ESP32-CAM example
        # arduino/compile-sketches v1.1.2
        uses: arduino/compile-sketches@25426ace8a446e747a3d3d7a9da759a6925613aa
        with:
          fqbn: esp32:esp32:esp32cam
          platforms: |
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          libraries: "[]"
          sketch-paths: |
            - examples/esp32cam_snapshot_upload
          verbose: true
