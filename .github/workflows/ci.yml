name: CI

on:
  push:
    # Feature/fix/etc. branches are validated via the `pull_request` trigger
    # below once a PR is open; keeping them here too as well as on
    # `pull_request` made every push to an open PR run CI twice (once per
    # trigger, each its own concurrency group since `push` and
    # `pull_request` land on different `github.ref` values). `main` stays
    # here to verify post-merge state (e.g. after a squash merge) that has
    # no corresponding `pull_request` event of its own.
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Job-level `permissions:` replaces (not merges with) the
      # workflow-level block above, so both are spelled out explicitly here:
      # contents:read lets actions/checkout fetch this PR's merge ref, and
      # pull-requests:read covers dorny/paths-filter@v3's GitHub API
      # listFiles() fallback (used when it can't diff locally because
      # actions/checkout's default fetch-depth:1 leaves no local base ref).
      # Without pull-requests:read that fallback 403s with "Resource not
      # accessible by integration"; without contents:read checkout itself
      # fails with "Repository not found".
      contents: read
      pull-requests: read
    outputs:
      esp32_example: ${{ steps.filter.outputs.esp32_example }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            esp32_example:
              - 'examples/esp32cam_snapshot_upload/**'
              - '.github/workflows/ci.yml'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 matches the Dockerfile's production runtime (and its
        # tflite-runtime dependency branch); 3.12 is the forward-looking
        # version. Testing only one left the other's runtime path unverified.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Run lint and tests
        run: scripts/ci/run-check.sh test
      - name: Upload coverage to GitHub Actions Summary
        if: always()
        run: |
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Audits the resolved dependency set, which doesn't vary by
          # interpreter version — run once instead of once per `test`
          # matrix leg (was previously duplicated across Python 3.11/3.12).
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.lock.txt
      - name: Dependency vulnerability audit
        run: scripts/ci/run-check.sh audit

  compile-esp32-example:
    needs: changes
    # Skip on pushes/PRs that don't touch the example sketch or this
    # workflow file -- arduino/compile-sketches (downloading the Arduino
    # ESP32 core + compiling the sketch) is one of the slower jobs here and
    # has no bearing on script/docs/tests-only changes. See #350.
    if: needs.changes.outputs.esp32_example == 'true'
    runs-on: ubuntu-latest
    # The Arduino toolchain cache key includes hashFiles of this workflow
    # file, so any future edit to it invalidates the cache -- give this job
    # enough headroom for a fully cold core download + compile, not just
    # the warm-cache case.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache Arduino CLI data
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino15-esp32cam-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            arduino15-esp32cam-
      - name: Prepare config.h for CI
        run: cp examples/esp32cam_snapshot_upload/config.h.example examples/esp32cam_snapshot_upload/config.h
      - name: Compile ESP32-CAM example
        # arduino/compile-sketches v1.1.2
        uses: arduino/compile-sketches@25426ace8a446e747a3d3d7a9da759a6925613aa
        with:
          fqbn: esp32:esp32:esp32cam
          platforms: |
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          libraries: "[]"
          sketch-paths: |
            - examples/esp32cam_snapshot_upload
          verbose: true
