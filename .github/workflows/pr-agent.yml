on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr_agent_job:
    if: >-
      ${{ github.event.sender.type != 'Bot' &&
          (github.event_name != 'issue_comment' ||
           (github.event.issue.pull_request &&
            github.event.sender.login == github.repository_owner &&
            github.event.issue.user.login == github.repository_owner)) &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.user.login == github.repository_owner) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    name: Run pr agent on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: qodo-ai/pr-agent@20bc0fe8ae7c1494c0be580f7ceb35a1c45e5741 # main
        env:
          CONFIG.MODEL: "gemini/gemini-2.5-flash-preview-05-20"
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: 64000
          PR_REVIEWER.EXTRA_INSTRUCTIONS: 'Please use Japanese in titles and descriptions.'
          PR_DESCRIPTION.EXTRA_INSTRUCTIONS: 'Please use Japanese in titles and descriptions. Titles should have prefix of commitlint pattern such as `feat:`, `chore:`, `test:`, `fix:`, `ci:`, `docs:` etc'
