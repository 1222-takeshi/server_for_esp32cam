[package]
name = "esp32cam-frame-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
jpeg = ["dep:turbojpeg"]

[dependencies]
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "load-dynamic"] }
sha2 = "=0.10.9"
turbojpeg = { version = "=1.5.1", default-features = false, optional = true }
