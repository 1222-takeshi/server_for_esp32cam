[package]
name = "esp32cam-frame-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[[bin]]
name = "frame-worker"
path = "src/main.rs"
required-features = ["jpeg"]

[features]
jpeg = ["dep:turbojpeg"]
transport = ["dep:tungstenite", "dep:subtle", "dep:getrandom", "dep:rustix"]
clock-probe = ["transport"]

[dependencies]
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "load-dynamic"] }
sha2 = "=0.10.9"
turbojpeg = { version = "=1.5.1", default-features = false, optional = true }
serde_json = "=1.0.154"
bytemuck = "=1.25.2"

tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"], optional = true }
subtle = { version = "=2.6.1", optional = true }
getrandom = { version = "=0.4.3", features = ["std"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "time", "net"], optional = true }

[[bin]]
name = "frame-live"
path = "src/live_main.rs"
required-features = ["jpeg", "transport"]

[[bin]]
name = "frame-clock"
path = "src/clock_main.rs"
required-features = ["clock-probe"]
