openapi: 3.1.0
info:
  title: server_for_esp32cam API
  description: |
    REST API for the ESP32-CAM snapshot server.

    ## Authentication

    Two token types are used:

    | Header | Scope |
    |--------|-------|
    | `X-API-Key: <DEVICE_API_KEY>` | Device endpoints (`/upload`, `/api/status_update`, `/api/log_error`, WebSocket upload); identity-bearing requests must match `ESP32CAM_SHARED_KEY_DEVICE_ID` in shared-key mode |
    | `Authorization: Bearer <ADMIN_TOKEN>` | Admin endpoints (`DELETE /api/cameras/*`, `PATCH /api/cameras/*`, `/api/cameras/*/logs`, `/metrics`, export endpoints) |

    When device authentication variables are not set, the check is skipped for
    local development. For multiple devices, configure
    `ESP32CAM_DEVICE_API_KEYS`; do not reuse one global key across identities.

  version: "1.0.0"
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: health
    description: Server health and readiness probes
  - name: upload
    description: JPEG snapshot and MP4 video upload from devices
  - name: cameras
    description: Camera registry and metadata
  - name: snapshots
    description: Snapshot query and export
  - name: detections
    description: Person detection results
  - name: device
    description: Device heartbeat and log ingestion
  - name: files
    description: Raw image file serving
  - name: metrics
    description: Prometheus metrics
  - name: videos
    description: Video query and file delivery
  - name: streaming
    description: MJPEG live video streaming

paths:
  /healthz:
    get:
      summary: Liveness probe
      description: Returns `{"status":"ok"}` when the server process is alive.
      tags: [health]
      responses:
        "200":
          description: Server is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzOk"

  /healthz/ready:
    get:
      summary: Readiness probe
      description: |
        Checks DB connectivity, upload directory write access, disk space,
        and async inference worker status.
        Returns `200 ready` when all checks pass, `503 degraded` otherwise.
      tags: [health]
      responses:
        "200":
          description: All checks passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzReady"
        "503":
          description: One or more checks failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzReady"

  /upload:
    post:
      summary: Upload a JPEG snapshot
      description: |
        Accepts a raw JPEG body from a device.
        The image is validated with Pillow, stored on disk, and queued for inference.
        Images exceeding `UPLOAD_MAX_IMAGE_DIMENSION` (default 4096 px) are rejected.
        Rate-limited to `UPLOAD_RATE_LIMIT` (default 10/min) per device API key.
      tags: [upload]
      security:
        - deviceApiKey: []
      parameters:
        - in: header
          name: X-Device-Id
          required: true
          schema:
            type: string
            maxLength: 128
            pattern: "^[A-Za-z0-9_\\-]+$"
          example: esp32cam-front-door
        - in: header
          name: X-Captured-At
          required: true
          schema:
            type: string
            format: date-time
          example: "2026-03-11T12:34:56Z"
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Image stored successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSuccess"
        "400":
          description: Invalid request (missing data, bad headers, invalid JPEG)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid device API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: API key is valid but not assigned to this device_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "413":
          description: Payload too large (exceeds MAX_CONTENT_LENGTH)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "415":
          description: Content-Type is not image/jpeg
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "429":
          description: Rate limit exceeded, or the inference queue is at `INFERENCE_QUEUE_MAX_DEPTH` (default disabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /api/cameras:
    get:
      summary: List all cameras
      description: Returns known cameras with their latest health status. For backward compatibility, a request without `limit` or `offset` returns all cameras; include either query parameter to request a page.
      tags: [cameras]
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000000
            default: 0
      responses:
        "200":
          description: Camera list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraList"

  /api/cameras/{camera_id}/videos:
    post:
      summary: Upload an MP4 video for a camera
      description: |
        Accepts either a raw `video/mp4` body or `multipart/form-data` with
        field `file` plus optional `captured_at` and `duration_ms` fields.
        Video uploads require fail-closed per-camera API keys from
        `ESP32CAM_DEVICE_API_KEYS`; a missing key header returns `401`, while a
        missing camera mapping or mismatched key returns `403`. Payloads over
        `ESP32CAM_MAX_VIDEO_CONTENT_LENGTH` return `413`. The server validates
        the MP4 `ftyp` signature and does not trust only Content-Type or client
        filenames. TLS/HTTPS termination is required for production deployments.
      tags: [upload]
      security:
        - deviceApiKey: []
      parameters:
        - $ref: "#/components/parameters/camera_id"
        - in: header
          name: X-Captured-At
          required: false
          schema:
            type: string
            format: date-time
          description: Capture timestamp for raw `video/mp4` uploads.
        - in: header
          name: X-Duration-Ms
          required: false
          schema:
            type: integer
            minimum: 0
          description: Video duration in milliseconds for raw `video/mp4` uploads.
      requestBody:
        required: true
        content:
          video/mp4:
            schema:
              type: string
              format: binary
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: MP4 video file. Field content type must be `video/mp4`.
                captured_at:
                  type: string
                  format: date-time
                duration_ms:
                  type: integer
                  minimum: 0
      responses:
        "201":
          description: Video stored successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoUploadSuccess"
        "400":
          description: Invalid request (empty body, invalid metadata, invalid duration)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing API key header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: Missing per-camera key mapping or mismatched API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Invalid camera ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "413":
          description: Payload too large (exceeds ESP32CAM_MAX_VIDEO_CONTENT_LENGTH)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "415":
          description: Unsupported media type or invalid MP4 payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

    get:
      summary: List videos for a camera
      description: Returns videos for the given camera, newest first, using cursor-based pagination.
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/camera_id"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of videos to return
        - in: query
          name: before
          schema:
            type: integer
          description: Return videos with id less than this value (cursor)
      responses:
        "200":
          description: Video list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoList"
        "404":
          description: Camera not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /api/cameras/{camera_id}/videos/{video_id}/content:
    get:
      summary: Serve video file for a camera
      description: |
        Streams the MP4 file for the given video. Returns 404 when the camera
        does not exist, when the video does not belong to the camera, or when
        the file has been removed from storage.
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/camera_id"
        - in: path
          name: video_id
          required: true
          schema:
            type: integer
          description: Numeric video identifier
      responses:
        "200":
          description: MP4 video binary
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: Camera not found, video not found, or video does not belong to this camera
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /api/cameras/{camera_id}:
    delete:
      summary: Delete a camera
      description: |
        Removes the camera record and all associated snapshots from the database.
        Pass `?delete_files=true` to also remove image files from disk.
      tags: [cameras]
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/camera_id"
        - in: query
          name: delete_files
          schema:
            type: boolean
            default: false
          description: Also delete stored image files
      responses:
        "200":
          description: Camera deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteCameraSuccess"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Camera not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

    patch:
      summary: Update camera metadata
      description: Updates `display_name` and/or `expected_interval_seconds` for the camera.
      tags: [cameras]
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/camera_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchCameraRequest"
      responses:
        "200":
          description: Camera updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchCameraSuccess"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Camera not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /api/cameras/{camera_id}/desired-config:
    get:
      summary: Get desired config for a camera
      description: Returns the server-stored desired config and last device acknowledgement state.
      tags: [cameras]
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/camera_id"
      responses:
        "200":
          description: Desired config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesiredConfigRecord"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    put:
      summary: Update desired config for a camera
      description: Whitelisted settings are stored with an incrementing version. `expected_version` can be used for optimistic concurrency.
      tags: [cameras]
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/camera_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesiredConfigUpdateRequest"
      responses:
        "200":
          description: Desired config updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesiredConfigRecord"
        "400":
          description: Invalid config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: expected_version does not match current version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /api/devices/{device_id}/desired-config:
    get:
      summary: Device polling endpoint for desired config
      description: ESP32-CAM calls this when awake. In shared-key mode, `ESP32CAM_DEVICE_API_KEY` must be paired with `ESP32CAM_SHARED_KEY_DEVICE_ID` and match the path `device_id`. For multiple devices, per-device API keys from `ESP32CAM_DEVICE_API_KEYS` must match the path `device_id`.
      tags: [device]
      security:
        - deviceApiKey: []
      parameters:
        - $ref: "#/components/parameters/device_id"
        - in: query
          name: current_version
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Desired config for the device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceDesiredConfigResponse"
        "401":
          description: Missing or invalid device API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: API key is valid but not assigned to this device_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /api/devices/{device_id}/desired-config/ack:
    post:
      summary: Acknowledge desired config application
      description: Records whether the device applied a config version and clears one-shot restart/OTA requests.
      tags: [device]
      security:
        - deviceApiKey: []
      parameters:
        - $ref: "#/components/parameters/device_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesiredConfigAckRequest"
      responses:
        "200":
          description: Ack recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesiredConfigRecord"
        "400":
          description: Invalid ack body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid device API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: API key is valid but not assigned to this device_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Desired config not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Ack version does not match current desired config version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /api/videos:
    get:
      summary: List videos across all cameras
      description: Returns videos from all cameras, newest first, using cursor-based pagination.
      tags: [videos]
      parameters:
        - in: query
          name: camera_id
          schema:
            type: string
          description: Filter by camera ID
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of videos to return
        - in: query
          name: before
          schema:
            type: integer
          description: Return videos with id less than this value (cursor)
      responses:
        "200":
          description: Video list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalVideoList"

  /api/cameras/{camera_id}/snapshots:
    get:
      summary: List snapshots for a camera
      description: |
        Returns a paginated list of snapshots for the given camera.
        Pass `?export=json` with `Authorization: Bearer <ADMIN_TOKEN>` to export all snapshots as JSON (up to 10 000 rows).
      tags: [snapshots]
      parameters:
        - $ref: "#/components/parameters/camera_id"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - in: query
          name: before
          schema:
            type: string
          description: Opaque cursor returned as next_before; do not combine with offset
        - in: query
          name: since
          schema:
            type: string
            format: date-time
          description: Filter snapshots captured at or after this timestamp
        - in: query
          name: until
          schema:
            type: string
            format: date-time
          description: Filter snapshots captured before this timestamp
        - in: query
          name: export
          schema:
            type: string
            enum: [json]
          description: Export all matching snapshots as JSON (requires admin token)
      responses:
        "200":
          description: Snapshot list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotList"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Admin token required for export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Camera not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /api/cameras/{camera_id}/upload-metrics:
    get:
      summary: Get upload metrics for a camera
      description: Returns frame counts, byte totals, error counts, and connection state.
      tags: [cameras]
      parameters:
        - $ref: "#/components/parameters/camera_id"
      responses:
        "200":
          description: Upload metrics snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadMetrics"
        "404":
          description: Camera not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /api/cameras/{camera_id}/logs:
    get:
      summary: Get device logs for a camera
      description: Returns the most recent device log entries for the given camera.
      tags: [device]
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/camera_id"
      responses:
        "200":
          description: Device log list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLogList"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Camera not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /api/detections:
    get:
      summary: List detections
      description: |
        Returns a paginated list of person-detection results across all cameras.
        Pass `?export=csv` with `Authorization: Bearer <ADMIN_TOKEN>` to export as CSV (up to 10 000 rows).
      tags: [detections]
      parameters:
        - in: query
          name: camera_id
          schema:
            type: string
          description: Filter by camera ID
        - in: query
          name: since
          schema:
            type: string
            format: date-time
          description: Filter detections since this timestamp
        - in: query
          name: confidence_min
          schema:
            type: number
            minimum: 0.0
            maximum: 1.0
          description: Minimum detection confidence score
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - in: query
          name: before
          schema:
            type: string
          description: Opaque cursor returned as next_before; do not combine with offset
        - in: query
          name: export
          schema:
            type: string
            enum: [csv]
          description: Export matching detections as CSV (requires admin token)
      responses:
        "200":
          description: Detection list or CSV file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionList"
            text/csv:
              schema:
                type: string
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Admin token required for export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /api/status_update:
    post:
      summary: Device heartbeat
      description: Records a heartbeat from a device, updating `last_seen_at`.
      tags: [device]
      security:
        - deviceApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id:
                  type: string
                  maxLength: 128
                  pattern: "^[A-Za-z0-9_\\-]+$"
      responses:
        "200":
          description: Heartbeat recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusUpdateSuccess"
        "400":
          description: Invalid device_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid device API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: API key is valid but not assigned to this device_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /api/log_error:
    post:
      summary: Ingest a device log entry
      description: |
        Stores a log message from a device for later review in the admin UI.
        Rate-limited to `LOG_ERROR_RATE_LIMIT` (default 30/min) per device API key.
      tags: [device]
      security:
        - deviceApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogErrorRequest"
      responses:
        "201":
          description: Log entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLogEntry"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid device API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: API key is valid but not assigned to this device_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /files/{filename}:
    get:
      summary: Retrieve a stored image
      description: Returns the raw JPEG bytes for the given filename.
      tags: [files]
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
          example: esp32cam-front-door_20260311_123456_abc12.jpg
      responses:
        "200":
          description: JPEG image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /files/{filename}/thumbnail:
    get:
      summary: Retrieve a downscaled thumbnail of a stored image
      description: |
        Returns a JPEG resized to fit within a 480x480 box (aspect ratio
        preserved), generated on demand from the full-resolution original.
        Used by the dashboard grid and the files list so painting a page of
        small previews doesn't require transferring full-resolution
        originals (see #338). Response caching matches `/files/{filename}`.
      tags: [files]
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
          example: esp32cam-front-door_20260311_123456_abc12.jpg
      responses:
        "200":
          description: JPEG thumbnail
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /stream/cameras/{camera_id}:
    get:
      summary: MJPEG live stream for a camera
      description: |
        Opens a `multipart/x-mixed-replace` stream that pushes JPEG frames as new
        snapshots arrive. The latest stored snapshot is sent immediately on connect.
        The stream closes after the camera's expected interval plus a 30-second
        grace period, or the configured `ESP32CAM_MJPEG_STREAM_IDLE_TIMEOUT_SECONDS`
        minimum, whichever is longer.
      tags: [streaming]
      parameters:
        - $ref: "#/components/parameters/camera_id"
      responses:
        "200":
          description: MJPEG stream (binary, unbounded)
          content:
            multipart/x-mixed-replace:
              schema:
                type: string
                format: binary
        "404":
          description: Camera not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Too many active streams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /metrics:
    get:
      summary: Prometheus metrics
      description: Returns Prometheus text-format metrics for upload totals and HTTP request counts.
      tags: [metrics]
      security:
        - adminToken: []
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

components:
  securitySchemes:
    deviceApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Device API key header. Legacy endpoints use `ESP32CAM_DEVICE_API_KEY`
        when configured, and identity-bearing requests must also match
        `ESP32CAM_SHARED_KEY_DEVICE_ID`. Use per-device keys from
        `ESP32CAM_DEVICE_API_KEYS` for multiple cameras; requests fail closed
        when the identity binding is missing or mismatched. Video upload
        always requires a matching camera key.
    adminToken:
      type: http
      scheme: bearer
      description: Set via `ESP32CAM_ADMIN_TOKEN`. Authentication is disabled when the variable is not set.

  parameters:
    camera_id:
      in: path
      name: camera_id
      required: true
      schema:
        type: string
        maxLength: 128
        pattern: "^[A-Za-z0-9_\\-]+$"
      example: esp32cam-front-door

    limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Maximum number of items to return

    offset:
      in: query
      name: offset
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of items to skip

  schemas:
    ErrorMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: "Camera not found"

    HealthzOk:
      type: object
      properties:
        status:
          type: string
          enum: [ok]

    HealthzReady:
      type: object
      properties:
        status:
          type: string
          enum: [ready, degraded]
        db:
          type: string
          enum: [ok, error]
        storage:
          type: string
          enum: [ok, error]
        disk_free_mb:
          type: integer
        inference_worker:
          type: string
          enum: [running, stopped]

    UploadSuccess:
      type: object
      properties:
        message:
          type: string
          example: "File uploaded successfully"
        filename:
          type: string
          example: "esp32cam-front-door_20260311_123456_abc12.jpg"
        size:
          type: integer
          description: File size in bytes
        device_id:
          type: string
          example: "esp32cam-front-door"
        captured_at:
          type: string
          format: date-time
        stored_at:
          type: string
          format: date-time

    VideoUploadSuccess:
      type: object
      required: [message, video]
      properties:
        message:
          type: string
          example: "Video uploaded successfully"
        video:
          $ref: "#/components/schemas/VideoRecord"

    VideoList:
      type: object
      required: [videos, camera_id]
      properties:
        videos:
          type: array
          items:
            $ref: "#/components/schemas/VideoRecord"
        camera_id:
          type: string

    GlobalVideoList:
      type: object
      required: [videos]
      properties:
        videos:
          type: array
          items:
            $ref: "#/components/schemas/VideoRecord"

    VideoRecord:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
          example: "video_20260311T123456000000_abcd.mp4"
        relative_path:
          type: string
          example: "esp32cam-front-door/videos/video_20260311T123456000000_abcd.mp4"
        size:
          type: integer
          description: File size in bytes
        camera_id:
          type: string
          maxLength: 128
          pattern: "^[A-Za-z0-9_\\-]+$"
        captured_at:
          type: string
          format: date-time
          nullable: true
        stored_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          minimum: 0
          nullable: true
        content_type:
          type: string
          enum: [video/mp4]
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          nullable: true
        processing_status:
          type: string
          enum: [pending, succeeded, failed, skipped]
        processing_error:
          type: string
          nullable: true

    CameraSummary:
      type: object
      properties:
        camera_id:
          type: string
        display_name:
          type: string
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        snapshot_count:
          type: integer
        health:
          type: string
          enum: [healthy, stale, offline, unknown]
        expected_interval_seconds:
          type: integer

    CameraList:
      type: object
      properties:
        total:
          type: integer
          description: Total number of known cameras.
        limit:
          type: integer
          nullable: true
          description: Number of cameras requested for this page.
        offset:
          type: integer
          description: Zero-based offset of this page.
        cameras:
          type: array
          items:
            $ref: "#/components/schemas/CameraSummary"

    DeleteCameraSuccess:
      type: object
      properties:
        message:
          type: string
          example: "Camera deleted"
        camera_id:
          type: string
        storage_deleted:
          type: boolean

    PatchCameraRequest:
      type: object
      properties:
        display_name:
          type: string
          description: Human-readable name for the camera
        expected_interval_seconds:
          type: integer
          minimum: 1
          description: Expected upload interval in seconds (used for health calculation)

    PatchCameraSuccess:
      type: object
      properties:
        camera_id:
          type: string
        display_name:
          type: string
          nullable: true
        expected_interval_seconds:
          type: integer

    DesiredConfig:
      type: object
      additionalProperties: false
      properties:
        capture_interval_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 300
        frame_size:
          type: string
          enum: [QVGA, VGA, SVGA, XGA, SXGA, UXGA]
          default: SVGA
        jpeg_quality:
          type: integer
          minimum: 10
          maximum: 63
          default: 12
        vflip:
          type: boolean
          default: false
        hmirror:
          type: boolean
          default: false
        restart_requested:
          type: boolean
          default: false
        ota_update_requested:
          type: boolean
          default: false
        ota_window_seconds:
          type: integer
          minimum: 30
          maximum: 600
          default: 120

    DesiredConfigUpdateRequest:
      type: object
      required: [config]
      properties:
        expected_version:
          type: integer
          minimum: 0
          description: Optional optimistic concurrency guard. Use 0 for create-if-absent.
        config:
          $ref: "#/components/schemas/DesiredConfig"

    DesiredConfigRecord:
      type: object
      properties:
        camera_id:
          type: string
        version:
          type: integer
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
        config:
          $ref: "#/components/schemas/DesiredConfig"
        last_acknowledged_version:
          type: integer
          nullable: true
        last_acknowledged_at:
          type: string
          format: date-time
          nullable: true
        last_acknowledged_message:
          type: string
          nullable: true
        last_acknowledged_success:
          type: boolean
          nullable: true
        last_firmware_version:
          type: string
          nullable: true
        last_free_heap:
          type: integer
          nullable: true

    DeviceDesiredConfigResponse:
      type: object
      properties:
        device_id:
          type: string
        version:
          type: integer
        changed:
          type: boolean
        config:
          $ref: "#/components/schemas/DesiredConfig"

    DesiredConfigAckRequest:
      type: object
      required: [version, applied]
      properties:
        version:
          type: integer
          minimum: 1
        applied:
          type: boolean
        message:
          type: string
          maxLength: 500
        firmware_version:
          type: string
          maxLength: 64
        free_heap:
          type: integer
          minimum: 0

    SnapshotRecord:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        camera_id:
          type: string
        size:
          type: integer
        captured_at:
          type: string
          format: date-time
          nullable: true
        stored_at:
          type: string
          format: date-time
        inference_status:
          type: string
          enum: [pending, succeeded, failed, skipped]
        inference_error:
          type: string
          nullable: true
        person_detected:
          type: boolean
          nullable: true
        detections:
          type: array
          items:
            $ref: "#/components/schemas/Detection"

    SnapshotList:
      type: object
      properties:
        camera_id:
          type: string
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        next_before:
          type: string
          nullable: true
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/SnapshotRecord"

    UploadMetrics:
      type: object
      properties:
        camera_id:
          type: string
        connections:
          type: integer
        active_connections:
          type: integer
        disconnects:
          type: integer
        frames_received:
          type: integer
        bytes_received:
          type: integer
        errors:
          type: integer
        last_error:
          type: string
          nullable: true
        last_frame_at:
          type: string
          format: date-time
          nullable: true

    DetectionRecord:
      type: object
      properties:
        detection_id:
          type: integer
        snapshot_id:
          type: integer
        camera_id:
          type: string
        filename:
          type: string
        captured_at:
          type: string
          format: date-time
          nullable: true
        stored_at:
          type: string
          format: date-time
        label:
          type: string
        score:
          type: number
          minimum: 0.0
          maximum: 1.0
        track_id:
          type: integer
          minimum: 1
          nullable: true
        bbox:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
          description: "[x1, y1, x2, y2] normalized coordinates"

    Detection:
      type: object
      properties:
        label:
          type: string
        score:
          type: number
          minimum: 0.0
          maximum: 1.0
        track_id:
          type: integer
          minimum: 1
          nullable: true
        bbox:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
          description: "[x1, y1, x2, y2] normalized coordinates"

    DetectionList:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        next_before:
          type: string
          nullable: true
        detections:
          type: array
          items:
            $ref: "#/components/schemas/DetectionRecord"

    StatusUpdateSuccess:
      type: object
      properties:
        message:
          type: string
          example: "Status updated"
        camera_id:
          type: string
        last_seen_at:
          type: string
          format: date-time

    LogErrorRequest:
      type: object
      required: [device_id, message]
      properties:
        device_id:
          type: string
          maxLength: 128
          pattern: "^[A-Za-z0-9_\\-]+$"
        level:
          type: string
          enum: [debug, info, warning, error, critical]
          default: error
        message:
          type: string
          maxLength: 2000

    DeviceLogEntry:
      type: object
      properties:
        id:
          type: integer
        camera_id:
          type: string
        level:
          type: string
          enum: [debug, info, warning, error, critical]
        message:
          type: string
        logged_at:
          type: string
          format: date-time

    DeviceLogList:
      type: object
      properties:
        camera_id:
          type: string
        logs:
          type: array
          items:
            $ref: "#/components/schemas/DeviceLogEntry"
