[platformio]
default_envs = esp32cam_serial_smoke, esp32cam_wifi_smoke, esp32cam_camera_init_smoke, esp32cam_jpeg_capture_smoke, esp32cam_http_upload_smoke

[env]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = /dev/cu.usbserial-1120
monitor_port = /dev/cu.usbserial-1120
; OTA-capable partition table. Keep this on all smoke-test envs so the
; initial USB flash can later be updated with ArduinoOTA/espota.
board_build.partitions = min_spiffs.csv
build_flags =
  -D CORE_DEBUG_LEVEL=3
lib_deps =
  bblanchon/ArduinoJson@^7.4.2

[env:esp32cam_serial_smoke]
build_src_filter =
  +<main.cpp>

[env:esp32cam_wifi_smoke]
build_src_filter =
  +<main.cpp>
build_flags =
  ${env.build_flags}
  -D WIFI_SMOKE_TEST

[env:esp32cam_camera_init_smoke]
build_src_filter =
  +<main.cpp>
build_flags =
  ${env.build_flags}
  -D CAMERA_INIT_SMOKE_TEST

[env:esp32cam_jpeg_capture_smoke]
build_src_filter =
  +<main.cpp>
build_flags =
  ${env.build_flags}
  -D JPEG_CAPTURE_SMOKE_TEST

[env:esp32cam_http_upload_smoke]
build_src_filter =
  +<main.cpp>
build_flags =
  ${env.build_flags}
  -D HTTP_UPLOAD_SMOKE_TEST


[env:esp32cam_http_upload_ota_usb]
build_src_filter =
  +<main.cpp>
build_flags =
  ${env.build_flags}
  -D HTTP_UPLOAD_SMOKE_TEST
  -D ENABLE_ARDUINO_OTA=1
upload_protocol = esptool

[env:esp32cam_http_upload_ota]
extends = env:esp32cam_http_upload_ota_usb
upload_protocol = espota
upload_port = ${sysenv.ESP32CAM_OTA_HOST}
upload_flags =
  --port=${sysenv.ESP32CAM_OTA_PORT}
  --auth=${sysenv.ESP32CAM_OTA_PASSWORD}

[env:esp32cam_websocket_upload]
build_src_filter =
  +<main.cpp>
build_flags =
  ${env.build_flags}
  -D WEBSOCKET_UPLOAD_SMOKE_TEST
lib_deps =
  ${env.lib_deps}
  links2004/WebSockets@^2.6.1

[env:esp32cam_websocket_upload_ota_usb]
extends = env:esp32cam_websocket_upload
build_flags =
  ${env:esp32cam_websocket_upload.build_flags}
  -D ENABLE_ARDUINO_OTA=1
upload_protocol = esptool

[env:esp32cam_websocket_upload_ota]
extends = env:esp32cam_websocket_upload_ota_usb
upload_protocol = espota
upload_port = ${sysenv.ESP32CAM_OTA_HOST}
upload_flags =
  --port=${sysenv.ESP32CAM_OTA_PORT}
  --auth=${sysenv.ESP32CAM_OTA_PASSWORD}

; Opt-in 5/10 Hz experiment. The ordinary main.cpp environments are unchanged.
[env:esp32cam_high_rate_capture]
build_src_filter =
  -<main.cpp>
  +<high_rate.cpp>
lib_deps =
  ${env.lib_deps}
  links2004/WebSockets@^2.6.1

; One firmware, acknowledged eco/tracking preparation; motor remains stopped.
[env:esp32cam_operating_profiles]
extends = env:esp32cam_high_rate_capture
build_flags =
  ${env.build_flags}
  -D OPERATING_PROFILES=1
