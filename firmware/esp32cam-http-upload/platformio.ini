[platformio]
default_envs = esp32cam_serial_smoke, esp32cam_wifi_smoke, esp32cam_camera_init_smoke, esp32cam_jpeg_capture_smoke

[env]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = /dev/cu.usbserial-1120
monitor_port = /dev/cu.usbserial-1120
build_flags =
  -D CORE_DEBUG_LEVEL=3

[env:esp32cam_serial_smoke]
build_src_filter =
  +<main.cpp>

[env:esp32cam_wifi_smoke]
build_src_filter =
  +<main.cpp>
build_flags =
  ${env.build_flags}
  -D WIFI_SMOKE_TEST

[env:esp32cam_camera_init_smoke]
build_src_filter =
  +<main.cpp>
build_flags =
  ${env.build_flags}
  -D CAMERA_INIT_SMOKE_TEST

[env:esp32cam_jpeg_capture_smoke]
build_src_filter =
  +<main.cpp>
build_flags =
  ${env.build_flags}
  -D JPEG_CAPTURE_SMOKE_TEST
